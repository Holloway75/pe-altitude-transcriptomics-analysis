# Conda specification of the main analysis environment (`deg`), as tested for
# the pipeline (R 4.5.3 / Python 3.12).  Create with:
#   conda env create -f environment.yml
name: deg
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - bioconductor-limma=3.66.0
  - bioconductor-edger=4.8.2
  - bioconductor-fgsea=1.36.2
  - r-data.table=1.18.4
  - r-matrix=1.7_5
  - r-ggplot2=4.0.3
  - r-jsonlite=2.0.0
  - r-optparse=1.8.2
  - numpy=2.5.1
  - pandas=3.0.3
  - scipy=1.18.0
  - statsmodels=0.14.6
